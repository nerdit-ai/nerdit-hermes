manifest_version: 2
name: nerdit
version: 0.1.1
description: Hermes puts what it builds online on its own machine and keeps it alive. Deploys a folder to the local Nerdit engine, watches the apps it runs, and tells the agent when one is down.
author: Nerdit
license: Apache-2.0
homepage: https://github.com/nerdit-ai/nerdit-hermes
requires_hermes: ">=0.22.0"
tags: [deploy, self-hosted, paas, devops, apps]
provides_tools:
  - nerdit_ship
  - nerdit_apps
  - nerdit_diagnose
  - nerdit_logs
  - nerdit_call
provides_hooks:
  - pre_llm_call
  - pre_tool_call
